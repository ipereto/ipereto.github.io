<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iván Pérez · Backend</title>
<meta name="description" content="Iván Felipe Pérez Torres — Backend developer, Java & Spring Boot, microservices and applied AI.">
<meta property="og:title" content="Iván Felipe Pérez Torres · Backend developer">
<meta property="og:description" content="Backend developer, Java & Spring Boot, microservices and applied AI. Journey, projects and skills.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ipereto.github.io/">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: three-lane journey (education · work · projects) is the spine; everything else hangs off it. Reading column 70ch, modules 1120px. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#111827; --ink-2:#4B5563; --line:#D9DEE6; --soft:#E8ECF2;
  --accent:#E8590C; --accent-soft:#FDE9DC; --on-accent:#FFFFFF;
  --edu:#6D3FD8; --edu-soft:#EEE8FC; --work:#0A7286; --work-soft:#DCF0F3; --proj:#E8590C; --proj-soft:#FDE9DC;
  --ok:#1E7B3E; --ok-soft:#DFF2E5; --bad:#B42318; --bad-soft:#FCE4E1; --off:#C3CAD5;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161B24; --ink:#E7EAF0; --ink-2:#A3ADBD; --line:#2A3140; --soft:#1D2330;
  --accent:#FF8A4C; --accent-soft:#3A2214; --on-accent:#1A0D05;
  --edu:#A98BFF; --edu-soft:#251C42; --work:#4CC3D6; --work-soft:#0F2E35; --proj:#FF8A4C; --proj-soft:#3A2214;
  --ok:#5ECB8B; --ok-soft:#12321F; --bad:#FF8A80; --bad-soft:#3B1714; --off:#3A4352; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B24; --ink:#E7EAF0; --ink-2:#A3ADBD; --line:#2A3140; --soft:#1D2330;
  --accent:#FF8A4C; --accent-soft:#3A2214; --on-accent:#1A0D05;
  --edu:#A98BFF; --edu-soft:#251C42; --work:#4CC3D6; --work-soft:#0F2E35; --proj:#FF8A4C; --proj-soft:#3A2214;
  --ok:#5ECB8B; --ok-soft:#12321F; --bad:#FF8A80; --bad-soft:#3B1714; --off:#3A4352; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[id]{scroll-margin-top:72px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font:700 17px var(--f-display);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav a{text-decoration:none;color:var(--ink-2);font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.active{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .1s linear}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{font:500 12px var(--f-mono);padding:6px 10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{flex:none;display:inline-grid;place-items:center;width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.theme:hover{border-color:var(--accent)}
.theme svg{width:16px;height:16px}

/* hero */
.hero .wrap{padding-block:64px 48px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(44px,7.4vw,84px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.role{font:500 15px var(--f-mono);color:var(--ink-2);margin-top:14px}
.role b{color:var(--ink);font-weight:500}
.lead{font-size:18px;color:var(--ink-2);max-width:60ch;margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px var(--f-body);text-decoration:none;padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{transform:translateY(-1px)}
.facts{display:grid;gap:10px}
.fact{border-left:3px solid var(--accent);padding:6px 0 6px 14px}
.fact b{display:block;font:800 34px var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--ink-2)}

/* sections */
section{padding-block:64px;border-top:1px solid var(--line)}
.head{display:grid;gap:10px;margin-bottom:28px;max-width:70ch}
.head h2{font-size:clamp(30px,4.4vw,46px);font-weight:700;letter-spacing:-.01em}
.head p{color:var(--ink-2)}

/* skill filter */
.filter{display:grid;gap:12px;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.ev .k{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.ev.edu .k{color:var(--edu)} .ev.work .k{color:var(--work)} .ev.proj .k{color:var(--proj)}
.ev ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.ev .gap{font-size:14px;color:var(--ink-2)}

/* journey */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .edu{background:var(--edu)} .legend .work{background:var(--work)} .legend .proj{background:var(--proj)}
.lanes-head,.jrow{display:grid;grid-template-columns:78px repeat(3,minmax(0,1fr));column-gap:14px}
.lanes-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.lanes-head div{font:500 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.lanes-head .edu{color:var(--edu)} .lanes-head .work{color:var(--work)} .lanes-head .proj{color:var(--proj)}
.journey{position:relative}
.jrow{position:relative}
.jrow .yr{font:500 13px var(--f-mono);color:var(--ink-2);padding-top:18px;text-align:right;font-variant-numeric:tabular-nums}
.lane{position:relative;padding-block:8px;min-width:0}
.lane::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--soft)}
.lane.edu::before{background:color-mix(in srgb,var(--edu) 22%,transparent)}
.lane.work::before{background:color-mix(in srgb,var(--work) 22%,transparent)}
.lane.proj::before{background:color-mix(in srgb,var(--proj) 22%,transparent)}
.item{position:relative;margin-left:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:opacity .3s,transform .3s,border-color .2s,box-shadow .2s;text-align:left;width:calc(100% - 28px);font:inherit;color:inherit;display:block}
.item::before{content:"";position:absolute;left:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid currentColor}
.item.edu{color:var(--edu)} .item.work{color:var(--work)} .item.proj{color:var(--proj)}
.item > *{color:var(--ink)}
.item:hover{border-color:currentColor}
.item .when{font:500 11.5px var(--f-mono);color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .tag{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px}
.item.edu .tag{background:var(--edu-soft);color:var(--edu)} .item.work .tag{background:var(--work-soft);color:var(--work)} .item.proj .tag{background:var(--proj-soft);color:var(--proj)}
.item h3{font:700 17px/1.25 var(--f-display);margin-top:4px;letter-spacing:-.005em}
.item .org{font-size:13.5px;color:var(--ink-2)}
.item .sum{font-size:14px;color:var(--ink-2);margin-top:6px}
.item.dim{opacity:.28}
.item.hit{box-shadow:0 0 0 2px currentColor}
.item.open{border-color:currentColor;box-shadow:0 0 0 2px currentColor}
.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink)}
.item.open .detail{display:grid;gap:8px}
.detail .lbl{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.detail ul{margin:0;padding-left:18px;display:grid;gap:3px;color:var(--ink)}
.stack{display:flex;flex-wrap:wrap;gap:5px}
.stack span{font:500 11.5px var(--f-mono);background:var(--soft);color:var(--ink);padding:2px 7px;border-radius:5px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button,.links a{font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;text-decoration:none}
.links button:hover,.links a:hover{border-color:var(--accent)}
.repo{font:500 12px var(--f-mono);display:inline-flex;gap:6px;align-items:center}
.repo .st{padding:1px 6px;border-radius:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.st.public{background:var(--ok-soft);color:var(--ok)} .st.private{background:var(--soft);color:var(--ink-2)} .st.pending{background:var(--accent-soft);color:var(--accent)}
.jtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.pbtn{display:inline-flex;align-items:center;gap:6px;font:500 13.5px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.pbtn:hover{border-color:var(--accent)}
.pbtn.main{background:var(--ink);border-color:var(--ink);color:var(--bg);min-width:128px;justify-content:center}
.pbtn svg{width:14px;height:14px;fill:currentColor}
.pstate{font:500 11.5px var(--f-mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

/* projects */
.feature{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
.feature h3{font-size:30px;font-weight:700}
.feature .meta{font:500 12.5px var(--f-mono);color:var(--ink-2)}
.feature p{color:var(--ink-2);font-size:15.5px}
.svgbox{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:520px;height:auto}
.labs{display:flex;flex-wrap:wrap;gap:5px}
.labs span{font:500 11.5px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink-2)}
.info{font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.pcard .y{font:500 12px var(--f-mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pcard h4{font-size:21px;font-weight:700}
.pcard p{font-size:14.5px;color:var(--ink-2)}
.pcard .learn{font-size:14px;color:var(--ink);border-left:3px solid var(--accent);padding-left:10px}
.role-pill{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}

/* svg */
svg .n rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .n.sel rect{stroke:var(--accent);stroke-width:2.5}
svg .clk{cursor:pointer}
svg .t{fill:var(--ink);font:600 13px var(--f-body)}
svg .s{fill:var(--ink-2);font:400 11px var(--f-body)}
svg .lb{fill:var(--ink-2);font:500 11px var(--f-mono)}
svg .lba{fill:var(--accent);font:500 11px var(--f-mono)}
svg .zone{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
svg .part{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
svg .rail{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .cell{stroke:none}
svg .cell.k0,svg .pt.k0{fill:var(--work)} svg .cell.k1,svg .pt.k1{fill:var(--edu)} svg .cell.k2,svg .pt.k2{fill:var(--proj)}
svg .pt.bad{fill:var(--bad)}
svg .pt{stroke:var(--surface);stroke-width:1.5}
svg .celltx{fill:var(--surface);font:500 10px var(--f-mono)}
svg .dlt rect{fill:var(--bad-soft);stroke:var(--bad)}
svg .fx{pointer-events:none}

/* skills */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start}
.tier h4{font-size:19px}
.tier p{font-size:13.5px;color:var(--ink-2)}
.tier .stack span{font-size:12.5px;padding:3px 9px}
.langs{margin-top:16px;font-size:14.5px;color:var(--ink-2)}

/* contact */
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
footer{padding-block:32px;border-top:1px solid var(--line);color:var(--ink-2);font-size:13.5px}
.avail{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f-body);color:var(--ok);background:var(--ok-soft);padding:5px 12px;border-radius:999px;margin:0 0 16px;width:max-content;max-width:100%}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.strip{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px;display:grid;gap:6px;min-width:0}
.strip-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.strip-head .eyebrow{margin-right:auto;color:var(--ink-2)}
.sk{display:inline-flex;align-items:center;gap:6px}
.sk i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sk i.edu{background:var(--edu)} .sk i.work{background:var(--work)} .sk i.proj{background:var(--proj)}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;min-width:620px;height:auto}
svg .sg{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
svg .sy{fill:var(--ink-2);font:500 11px var(--f-mono)}
svg .sl{stroke-width:2;opacity:.3} svg .sl.edu{stroke:var(--edu)} svg .sl.work{stroke:var(--work)} svg .sl.proj{stroke:var(--proj)}
svg .sb{cursor:pointer;transition:opacity .2s} svg .sb:hover{opacity:.75}
svg .sb.edu{fill:var(--edu)} svg .sb.work{fill:var(--work)} svg .sb.proj{fill:var(--proj)}
svg .sb .dot{stroke:var(--surface);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
  svg .sb{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
  svg .sb.isdot{transform-origin:center;animation-name:pop}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes pop{from{transform:scale(0)}}
  @supports (animation-timeline:view()){
    .jrow,.pcard,.tier,.feature,section .head{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
    @keyframes rise{from{opacity:.3;transform:translateY(22px)}}
  }
}
.ihead{all:unset;cursor:pointer}
.ihead:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.item .when::after{content:"+";margin-left:auto;font:500 15px var(--f-mono);color:var(--ink-2)}
.item.open .when::after{content:"−"}
.chip .cnt{font:500 11px var(--f-mono);margin-left:6px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.chip[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--on-accent) 25%,transparent);color:var(--on-accent)}
.expand{margin-left:auto;font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.expand:hover{border-color:var(--accent)}
#projects{background:var(--soft)}
.pcard{border-top:4px solid var(--line);transition:transform .2s,box-shadow .2s}
.pcard.edu{border-top-color:var(--edu)} .pcard.proj{border-top-color:var(--proj)} .pcard.work{border-top-color:var(--work)}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px color-mix(in srgb,var(--ink) 60%,transparent)}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.seej{font:600 13px var(--f-body);border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0}
.seej:hover{text-decoration:underline}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px;max-width:760px}
.cbox .big{font:700 clamp(24px,3.4vw,34px)/1.15 var(--f-display)}

@media (max-width:900px){
  .hero .wrap,.feature{grid-template-columns:minmax(0,1fr)}
  .pgrid,.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .evidence{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .lanes-head{display:none}
  .jrow{grid-template-columns:minmax(0,1fr)}
  .jrow .yr{text-align:left;padding:14px 0 0 0;font-weight:500}
  .lane.empty{display:none}
  .lane::before{left:11px}
  .pgrid,.tiers{grid-template-columns:minmax(0,1fr)}
  .top .wrap{flex-wrap:wrap;row-gap:4px}
  .brand{flex:1}
  .nav{order:3;flex-basis:100%}
  [id]{scroll-margin-top:110px}
  .cbox{padding:20px}
  section{padding-block:48px}
}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top">Iván Pérez<span>.</span></a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>

function mkPath(pts){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l;}return {pts,seg,len:L||1};}
function ptAt(P,p){let d=Math.max(0,Math.min(1,p))*P.len;for(let i=0;i<P.seg.length;i++){if(d<=P.seg[i]||i===P.seg.length-1){const f=P.seg[i]?Math.min(1,d/P.seg[i]):0;const a=P.pts[i],b=P.pts[i+1];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}d-=P.seg[i];}return P.pts[0];}

function kStep(dt){
  K.t+=dt;
  while(K.t>=K.next){K.next+=1.1;const key=K.n%3;K.n++;K.msgs.push({key,ph:'in',p:0,poison:K.n%7===0});}
  for(const m of K.msgs){
    if(m.ph==='stored'){m.h-=dt;if(m.h<=0){m.ph='out';m.p=0;K.cells[m.key]=K.cells[m.key].filter(c=>c.o!==m.o);}continue;}
    if(m.ph==='retry'){m.h-=dt;if(m.h<=0){m.ph='dlt';m.p=0;}continue;}
    m.p+=dt/({in:.8,out:.7,dlt:.6}[m.ph]);if(m.p<1)continue;
    if(m.ph==='in'){m.ph='stored';m.h=1.4;m.o=K.off[m.key]++;K.cells[m.key].push({o:m.o,poison:m.poison});if(K.cells[m.key].length>6)K.cells[m.key].shift();}
    else if(m.ph==='out'){if(m.poison){m.ph='retry';m.h=1;}else{m.done=true;K.done[m.key<2?0:1]++;}}
    else if(m.ph==='dlt'){m.done=true;K.dlt++;}
  }
  K.msgs=K.msgs.filter(m=>{if(m.done){if(m.el)m.el.remove();return false;}return true;});
  kRender();
}
function kRender(){
  const fx=$('#kfx');if(!fx)return;

    if(!m.el){m.el=document.createElementNS(NS,'circle');m.el.setAttribute('r','6');fx.appendChild(m.el);}
    let xy;
    if(m.ph==='in')xy=ptAt(KP.in[m.key],m.p);
    else if(m.ph==='out')xy=ptAt(KP.out[m.key],m.p);
    else if(m.ph==='retry'){const c=m.key<2?[557,86]:[557,148];xy=[c[0]+Math.sin(K.t*18)*3,c[1]];}
    else xy=ptAt(m.key<2?KP.dlt[0]:KP.dlt[1],m.p);
    m.el.setAttribute('cx',xy[0].toFixed(1));m.el.setAttribute('cy',xy[1].toFixed(1));
    m.el.setAttribute('class','pt '+((m.ph==='retry'||m.ph==='dlt')?'bad':'k'+m.key));
  }
  for(let i=0;i<3;i++){const g=document.getElementById('kc'+i);if(!g)continue;
    g.innerHTML=K.cells[i].map((c,j)=>'<rect class="cell k'+i+'" x="'+(222+j*30)+'" y="'+(KD.P[i]+8)+'" width="26" height="24" rx="4" opacity="'+(c.poison?.55:1)+'"/><text class="celltx" x="'+(235+j*30)+'" y="'+(KD.P[i]+24)+'" text-anchor="middle">'+c.o+'</text>').join('');}
  const a=$('#kc1t'),b=$('#kc2t'),d=$('#kdlt');
  if(a)a.textContent='P0 · P1 · '+K.done[0]+' ✓';if(b)b.textContent='P2 · '+K.done[1]+' ✓';if(d)d.textContent=L==='es'?K.dlt+' apartados':K.dlt+' parked';
}
let kPlaying=!REDUCED,kVis=false,kPlayer;
function renderKafka(){
  const i=byId.kafka;
  $('#kafkaFeature').innerHTML='<div style="display:grid;gap:12px;min-width:0"><div class="svgbox" id="kSvg">'+kSvg()+'</div><div class="jtools" id="kTools" style="margin:0"></div><div class="info" id="kInfo" aria-live="polite">'+t(S.kInfo0)+'</div></div>'
   +'<div style="display:grid;gap:12px;align-content:start;min-width:0"><span class="meta">2026 · '+t(i.kind)+' · '+repoHtml(i.repo)+'</span><h3>'+t(i.title)+'</h3><p>'+t(i.sum)+'</p><ul style="margin:0;padding-left:18px;color:var(--ink-2);font-size:14.5px;display:grid;gap:4px">'+t(i.did).map(d=>'<li>'+d+'</li>').join('')+'</ul><div class="labs">'+['00 cluster','01 producer','02 consumer','03 partitions','04 groups','05 offsets','06 replication','07 transactions','08 compaction','09 Spring Kafka','10 outbox','11 idempotency','12 retries & DLT','13 Streams'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="stack">'+i.stack.map(s=>'<span>'+s+'</span>').join('')+'</div></div>';
  kPlayer=player($('#kTools'),{
    m(){kPlaying=!kPlaying;kPlayer.set(kPlaying?'playing':'paused');},
    s(){kPlaying=false;kStep(.25);kPlayer.set('paused');},
    r(){kReset();kPlayer.set(kPlaying?'playing':'paused');}
  });
  kPlayer.set(kPlaying?'playing':'paused');
  K.msgs.forEach(m=>{m.el=null;});
  kRender();
  $('#kSvg').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(!g)return;document.querySelectorAll('#kSvg .n.sel').forEach(x=>x.classList.remove('sel'));if(g.classList.contains('n'))g.classList.add('sel');$('#kInfo').innerHTML=t(KI[g.dataset.k]);});
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{kVis=es[es.length-1].isIntersecting;}).observe($('#kSvg'));else kVis=true;
}
let lastTs=0;
function frame(ts){const dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;lastTs=ts;if(kPlaying&&kVis)kStep(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

  const ids=['buildear','golia','micro','granja','rtfm','youglish','g11','g10'];

    return '<article class="pcard '+i.lane+'"><div class="y"><span>'+(typeof i.when==='string'?i.when:t(i.when))+'</span><span class="role-pill">'+t(i.kind)+'</span></div><h4>'+t(i.title)+'</h4><p style="font-size:13.5px">'+t(i.org)+'</p><p>'+t(i.sum)+'</p>'

/* ---------------- theme ---------------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
const sysDark=()=>!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
function curTheme(){const a=document.documentElement.getAttribute('data-theme');return a==='dark'||a==='light'?a:(sysDark()?'dark':'light');}
function drawTheme(){const d=curTheme()==='dark';const b=$('#themeBtn');b.innerHTML=d?SUN:MOON;const lbl=L==='es'?(d?'Cambiar a modo claro':'Cambiar a modo oscuro'):(d?'Switch to light mode':'Switch to dark mode');b.setAttribute('aria-label',lbl);b.title=lbl;}
try{const th=localStorage.getItem('theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}drawTheme();});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawTheme);

/* ---------------- language ---------------- */
function renderAll(){renderStatic();renderChips();renderJourney();renderKafka();renderProjects();renderTiers();tour.redraw();drawTheme();}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b||b.dataset.l===L)return;L=b.dataset.l;try{localStorage.setItem('lang',L);}catch(err){}
  const kp=kPlaying;renderAll();kPlaying=kp;kPlayer.set(kp?'playing':'paused');});
renderAll();
const SEC=['journey','projects','skills','contact'];
function onScroll(){const h=document.documentElement;const p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);const pr=$('#progress');if(pr)pr.style.width=Math.min(100,p*100).toFixed(2)+'%';
  let cur='';SEC.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<140)cur=id;});
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));}
addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
