<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iván Pérez · Backend</title>
<meta name="description" content="Iván Felipe Pérez Torres — Backend developer, Java & Spring Boot, microservices and applied AI.">
<meta property="og:title" content="Iván Felipe Pérez Torres · Backend developer">
<meta property="og:description" content="Backend developer, Java & Spring Boot, microservices and applied AI. Journey, projects and skills.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ipereto.github.io/">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: hero with a one-line career strip, then the three-lane journey (education · work · projects), then soft skills as tiles, projects and contact. Modules 1120px. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#111827; --ink-2:#4B5563; --line:#D9DEE6; --soft:#E8ECF2;
  --accent:#E8590C; --accent-soft:#FDE9DC; --on-accent:#FFFFFF;
  --edu:#6D3FD8; --edu-soft:#EEE8FC; --work:#0A7286; --work-soft:#DCF0F3; --proj:#E8590C; --proj-soft:#FDE9DC;
  --sk:#B4235A; --sk-soft:#FBE6EE;
  --ok:#1E7B3E; --ok-soft:#DFF2E5; --bad:#B42318; --bad-soft:#FCE4E1; --off:#C3CAD5;
  --manila:#FBF0D3; --manila-line:#E2C98C; --manila-chip:#F3E2B5;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161B24; --ink:#E7EAF0; --ink-2:#A3ADBD; --line:#2A3140; --soft:#1D2330;
  --accent:#FF8A4C; --accent-soft:#3A2214; --on-accent:#1A0D05;
  --edu:#A98BFF; --edu-soft:#251C42; --work:#4CC3D6; --work-soft:#0F2E35; --proj:#FF8A4C; --proj-soft:#3A2214;
  --sk:#FF7AAE; --sk-soft:#3A1726;
  --ok:#5ECB8B; --ok-soft:#12321F; --bad:#FF8A80; --bad-soft:#3B1714; --off:#3A4352;
  --manila:#252016; --manila-line:#4A3F26; --manila-chip:#342C1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B24; --ink:#E7EAF0; --ink-2:#A3ADBD; --line:#2A3140; --soft:#1D2330;
  --accent:#FF8A4C; --accent-soft:#3A2214; --on-accent:#1A0D05;
  --edu:#A98BFF; --edu-soft:#251C42; --work:#4CC3D6; --work-soft:#0F2E35; --proj:#FF8A4C; --proj-soft:#3A2214;
  --sk:#FF7AAE; --sk-soft:#3A1726;
  --ok:#5ECB8B; --ok-soft:#12321F; --bad:#FF8A80; --bad-soft:#3B1714; --off:#3A4352;
  --manila:#252016; --manila-line:#4A3F26; --manila-chip:#342C1D; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[id]{scroll-margin-top:72px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font:700 17px var(--f-display);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav a{text-decoration:none;color:var(--ink-2);font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.active{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .1s linear}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{font:500 12px var(--f-mono);padding:6px 10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{flex:none;display:inline-grid;place-items:center;width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.theme:hover{border-color:var(--accent)}
.theme svg{width:16px;height:16px}

/* hero */
.hero .wrap{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.7fr) minmax(0,1.05fr);gap:32px 40px;align-items:end}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2)}
.hmeta .mi{display:inline-flex;align-items:center;gap:6px}
.hmeta .mi svg{width:15px;height:15px;flex:none}
.hmeta .city svg{color:var(--bad)} .hmeta .lng svg{color:var(--work)}
.route{display:flex;align-items:stretch;gap:10px;margin-top:22px;max-width:620px}
.route .step{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.route .step > svg,.route .step .flagw svg{width:18px;height:18px;flex:none;margin-top:2px}
.route .step.goal > svg{color:var(--edu)}
.route .step b{display:block;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.route .step.now b{color:var(--accent)} .route .step.goal b{color:var(--edu)}
.route .step div span{font-size:13.5px;color:var(--ink);line-height:1.35}
.route .step .flagw{color:var(--accent)}
.route .rarrow{align-self:center;font:600 18px var(--f-mono);color:var(--ink-2)}
@media (max-width:560px){.route{flex-direction:column}.route .rarrow{transform:rotate(90deg);align-self:flex-start;margin-left:16px}}

.avail{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f-body);color:var(--ok);background:var(--ok-soft);padding:5px 12px;border-radius:999px}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.goalpill svg{width:16px;height:16px;color:var(--edu);flex:none}
.goalpill b{font-weight:700;color:var(--edu)}
.nowb{font-weight:700;color:var(--accent)}
.nowpill{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.flagw{display:inline-grid;place-items:center;color:var(--accent)}
.flagw svg{width:16px;height:16px}
.toolw svg{animation:none!important;transform-origin:30% 70%}
@media (prefers-reduced-motion:no-preference){.toolw svg{animation:tinker 2.4s ease-in-out infinite!important}}
@keyframes tinker{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-6deg)}}
svg .cloth{transform-box:fill-box;transform-origin:left center}
@media (prefers-reduced-motion:no-preference){svg .cloth{animation:wave 1.4s ease-in-out infinite}.flagw svg{animation:bob 1.4s ease-in-out infinite}}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-12deg) scaleX(.86)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14.5px;color:var(--ink)}
.langline svg{width:16px;height:16px;color:var(--accent);flex:none}
.hero h1{font-size:clamp(40px,5.2vw,66px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.role{font:500 15px var(--f-mono);color:var(--ink-2);margin-top:12px}
.role b{color:var(--ink);font-weight:500}
.lead{font-size:18px;color:var(--ink-2);max-width:56ch;margin-top:16px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px var(--f-body);text-decoration:none;padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{transform:translateY(-1px)}
.facts{display:grid;gap:12px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.brief .bh{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brief .row{display:grid;gap:5px}
.brief .rt{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font:700 14px var(--f-display)}
.brief .lvl{display:flex;gap:3px}.brief .lvl i{width:14px;height:5px;border-radius:3px;background:var(--line)}.brief .lvl i.on{background:var(--accent)}
.brief .bt{display:flex;flex-wrap:wrap;gap:4px}
.brief .bt span{font:500 11px var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:4px}
.brief .rt small{font:400 11.5px var(--f-body);color:var(--ink-2);margin-left:2px}
.citypill svg{width:15px;height:15px;color:var(--bad);flex:none}
.langpill svg{width:15px;height:15px;color:var(--work);flex:none}
.fact{border-left:3px solid var(--accent);padding:6px 0 6px 14px}
.fact b{display:block;font:800 36px var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--ink-2)}
.strip{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px;display:grid;gap:6px;min-width:0}
.strip-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.strip-head .eyebrow{margin-right:auto;color:var(--ink-2)}
.dotk{display:inline-flex;align-items:center;gap:6px}
.dotk i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dotk i.edu{background:var(--edu)} .dotk i.work{background:var(--work)} .dotk i.proj{background:var(--proj)}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;min-width:620px;height:auto}
svg .sg{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
svg .sy{fill:var(--ink-2);font:500 11px var(--f-mono)}
svg .sl{stroke-width:2;opacity:.3} svg .sl.edu{stroke:var(--edu)} svg .sl.work{stroke:var(--work)} svg .sl.proj{stroke:var(--proj)}
svg .sb{cursor:pointer;transition:opacity .2s} svg .sb:hover{opacity:.75}
svg .sb.edu{fill:var(--edu)} svg .sb.work{fill:var(--work)} svg .sb.proj{fill:var(--proj)}
svg .sb .dot{stroke:var(--surface);stroke-width:2.5}

/* sections */
section{padding-block:64px;border-top:1px solid var(--line)}
.head{display:grid;gap:10px;margin-bottom:24px;max-width:68ch}
.head h2{font-size:clamp(30px,4.4vw,46px);font-weight:700;letter-spacing:-.01em}
.head p{color:var(--ink-2)}

/* filters */
.filter{display:grid;gap:10px;margin-bottom:18px}
.fgroup{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
.flabel{font:500 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--f-body);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.soft svg{width:14px;height:14px;color:var(--sk)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] svg{color:var(--on-accent)}
.chip .cnt{font:500 11px var(--f-mono);padding:0 6px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.chip[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--on-accent) 25%,transparent);color:var(--on-accent)}
.evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.ev .k{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.ev.edu .k{color:var(--edu)} .ev.work .k{color:var(--work)} .ev.proj .k{color:var(--proj)}
.ev ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.ev .gap{font-size:14px;color:var(--ink-2)}

/* journey */
.jtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .edu{background:var(--edu)} .legend .work{background:var(--work)} .legend .proj{background:var(--proj)}
.legend .tk{width:18px;height:12px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.legend .sk{width:18px;height:12px;border-radius:999px;background:var(--sk-soft);border:1px solid var(--sk)}
.expand{margin-left:auto;font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.expand:hover{border-color:var(--accent)}
.lanes-head,.jrow{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));column-gap:14px}
.lanes-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.lanes-head div{font:500 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.lanes-head .edu{color:var(--edu)} .lanes-head .work{color:var(--work)} .lanes-head .proj{color:var(--proj)}
.jrow{position:relative}
.jrow .yr{font:600 14px var(--f-mono);color:var(--ink-2);padding-top:16px;text-align:right;font-variant-numeric:tabular-nums}
.lane{position:relative;padding-block:8px;min-width:0;display:grid;gap:10px;align-content:start}
.lane::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px}
.lane.edu::before{background:color-mix(in srgb,var(--edu) 22%,transparent)}
.lane.work::before{background:color-mix(in srgb,var(--work) 22%,transparent)}
.lane.proj::before{background:color-mix(in srgb,var(--proj) 22%,transparent)}
.item{position:relative;margin-left:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;transition:opacity .3s,border-color .2s,box-shadow .2s,transform .2s;min-width:0}
.item::before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid currentColor}
.item.edu{color:var(--edu)} .item.work{color:var(--work)} .item.proj{color:var(--proj)}
.item > *{color:var(--ink)}
.item:hover{border-color:currentColor;transform:translateX(2px)}
.item .when{font:500 11.5px var(--f-mono);color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .when::after{content:"+";margin-left:auto;font:500 15px var(--f-mono);color:var(--ink-2)}
.item.open > .when::after{content:"\2212"}
.kids{display:grid;gap:8px;margin-top:10px;padding-left:10px;border-left:2px dashed color-mix(in srgb,var(--edu) 40%,transparent)}
.lane.spancell{grid-column:span 2}
.lane.spancell > .item{width:calc(50% - 7px);box-sizing:border-box}
.lane.spancell > .item:has(> .kids.split){width:auto}
.kids.split{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;border-left:0;padding-left:0}
.kcol{display:grid;gap:8px;align-content:start;min-width:0;padding-left:10px;border-left:2px dashed color-mix(in srgb,var(--edu) 40%,transparent)}
.kcol.kw{border-left-color:color-mix(in srgb,var(--work) 45%,transparent)}
.item.work{border-left:5px solid var(--work);padding-top:20px}
.item.work::after{content:"";position:absolute;top:7px;left:50%;width:34px;height:7px;transform:translateX(-50%);border-radius:4px;background:var(--bg);border:1px solid var(--line);box-shadow:inset 0 1px 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.item.work.kid::after{background:var(--surface)}
.item.work.kid{padding-top:20px}
.item.work.kid.inner{border-left-width:1px;padding-top:9px}
.item.work.kid.inner::after{display:none}
.item.work > .kids{border-left-color:color-mix(in srgb,var(--work) 45%,transparent)}
.item.proj > .kids{border-left-color:color-mix(in srgb,var(--proj) 45%,transparent)}
.item.work > .kmore{color:var(--work)} .item.proj > .kmore{color:var(--proj)}
.item.cert::after{content:"";position:absolute;top:-1px;right:12px;width:14px;height:30px;background:linear-gradient(90deg,var(--edu) 0 30%,color-mix(in srgb,var(--edu) 70%,var(--surface)) 30% 70%,var(--edu) 70%);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.item.cert > .when{padding-right:24px}
.item.dip{outline:1px solid color-mix(in srgb,var(--edu) 30%,transparent);outline-offset:-5px;padding:14px 16px}
.item.dip.honors{margin-top:16px}
.seal{position:absolute;top:-16px;right:40px;display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 3px;background:var(--surface);border:1px solid color-mix(in srgb,var(--edu) 45%,transparent);border-radius:999px;font:600 9.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--edu);transform:rotate(-2deg);box-shadow:0 4px 12px -8px color-mix(in srgb,var(--edu) 70%,transparent)}
.seal svg{width:28px;height:28px;flex:none;margin-block:-4px}
.item.deliv,.item.deliv.kid{margin-top:15px;border-top-left-radius:0;background:var(--manila);border-color:var(--manila-line)}
.item.deliv:hover{border-color:currentColor}
.item.deliv > .ftab{border-color:var(--manila-line)}
.item.deliv .tt{background:var(--manila-chip)}
.ftab{position:absolute;left:-1px;bottom:100%;display:inline-flex;align-items:center;gap:5px;padding:3px 11px 1px 8px;background:inherit;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;font:600 9.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);transition:border-color .2s}
.ftab svg{width:12px;height:12px;flex:none}
.ftab.public{color:var(--ok)} .ftab.pending{color:var(--accent)}
.item.deliv.proj:hover > .ftab{border-color:var(--proj)} .item.deliv.edu:hover > .ftab{border-color:var(--edu)}
.item.kid{margin-left:0;background:var(--bg);padding:9px 11px}
.item.kid::before{display:none}
.item.kid h3{font-size:15px}
.item.kid:hover{transform:none}
.item .tag{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px}
.item.edu .tag{background:var(--edu-soft);color:var(--edu)} .item.work .tag{background:var(--work-soft);color:var(--work)} .item.proj .tag{background:var(--proj-soft);color:var(--proj)}

};
const KD={P:[70,128,186]};
function kSvg(){
  let o='';const P=KD.P;

function mkPath(pts){let Ln=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);Ln+=l;}return {pts,seg,len:Ln||1};}
function ptAt(P,p){let d=Math.max(0,Math.min(1,p))*P.len;for(let i=0;i<P.seg.length;i++){if(d<=P.seg[i]||i===P.seg.length-1){const f=P.seg[i]?Math.min(1,d/P.seg[i]):0;const a=P.pts[i],b=P.pts[i+1];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}d-=P.seg[i];}return P.pts[0];}
const KP={in:[0,1,2].map(i=>mkPath([[128,140],[150,140],[150,KD.P[i]+20],[186,KD.P[i]+20]])),out:[0,1,2].map(i=>mkPath([[406,KD.P[i]+20],[440,KD.P[i]+20],[440,i<2?86:148],[486,i<2?86:148]])),dlt:[mkPath([[628,86],[644,86],[644,229],[628,229]]),mkPath([[557,172],[557,206]])]};
const K={t:0,next:0,msgs:[],cells:[[],[],[]],off:[0,0,0],n:0,dlt:0,done:[0,0]};
function kReset(){const fx=$('#kfx');if(fx)fx.innerHTML='';Object.assign(K,{t:0,next:0,msgs:[],cells:[[],[],[]],off:[0,0,0],n:0,dlt:0,done:[0,0]});kRender();}
function kStep(dt){
  K.t+=dt;
  while(K.t>=K.next){K.next+=1.1;const key=K.n%3;K.n++;K.msgs.push({key,ph:'in',p:0,poison:K.n%7===0});}
  for(const m of K.msgs){
    if(m.ph==='stored'){m.h-=dt;if(m.h<=0){m.ph='out';m.p=0;K.cells[m.key]=K.cells[m.key].filter(c=>c.o!==m.o);}continue;}
    if(m.ph==='retry'){m.h-=dt;if(m.h<=0){m.ph='dlt';m.p=0;}continue;}
    m.p+=dt/({in:.8,out:.7,dlt:.6}[m.ph]);if(m.p<1)continue;
    if(m.ph==='in'){m.ph='stored';m.h=1.4;m.o=K.off[m.key]++;K.cells[m.key].push({o:m.o,poison:m.poison});if(K.cells[m.key].length>6)K.cells[m.key].shift();}
    else if(m.ph==='out'){if(m.poison){m.ph='retry';m.h=1;}else{m.done=true;K.done[m.key<2?0:1]++;}}
    else if(m.ph==='dlt'){m.done=true;K.dlt++;}
  }
  K.msgs=K.msgs.filter(m=>{if(m.done){if(m.el)m.el.remove();return false;}return true;});
  kRender();
}
function kRender(){
  const fx=$('#kfx');if(!fx)return;
  for(const m of K.msgs){
    if(m.ph==='stored'){if(m.el){m.el.remove();m.el=null;}continue;}
    if(!m.el){m.el=document.createElementNS(NS,'circle');m.el.setAttribute('r','6');fx.appendChild(m.el);}
    let xy;
    if(m.ph==='in')xy=ptAt(KP.in[m.key],m.p);
    else if(m.ph==='out')xy=ptAt(KP.out[m.key],m.p);
    else if(m.ph==='retry'){const c=m.key<2?[557,86]:[557,148];xy=[c[0]+Math.sin(K.t*18)*3,c[1]];}
    else xy=ptAt(m.key<2?KP.dlt[0]:KP.dlt[1],m.p);
    m.el.setAttribute('cx',xy[0].toFixed(1));m.el.setAttribute('cy',xy[1].toFixed(1));
    m.el.setAttribute('class','pt '+((m.ph==='retry'||m.ph==='dlt')?'bad':'k'+m.key));
  }
  for(let i=0;i<3;i++){const g=document.getElementById('kc'+i);if(!g)continue;
    g.innerHTML=K.cells[i].map((c,j)=>'<rect class="cell k'+i+'" x="'+(222+j*30)+'" y="'+(KD.P[i]+8)+'" width="26" height="24" rx="4" opacity="'+(c.poison?.55:1)+'"/><text class="celltx" x="'+(235+j*30)+'" y="'+(KD.P[i]+24)+'" text-anchor="middle">'+c.o+'</text>').join('');}
  const a=$('#kc1t'),b=$('#kc2t'),d=$('#kdlt');
  if(a)a.textContent='P0 · P1 · '+K.done[0]+' ✓';if(b)b.textContent='P2 · '+K.done[1]+' ✓';if(d)d.textContent=L==='es'?K.dlt+' apartados':K.dlt+' parked';
}
let kPlaying=!REDUCED,kVis=false,kPlayer;
function renderKafka(){
  const i=byId.kafka;
  $('#kafkaFeature').innerHTML='<div style="display:grid;gap:12px;min-width:0"><div class="svgbox" id="kSvg">'+kSvg()+'</div><div class="jtools" id="kTools" style="margin:0"></div><div class="info" id="kInfo" aria-live="polite">'+t(S.kInfo0)+'</div></div>'
   +'<div style="display:grid;gap:12px;align-content:start;min-width:0"><span class="meta">2026 · '+t(i.kind)+' · '+repoHtml(i.repo)+'</span><h3>'+t(i.title)+'</h3><p>'+t(i.sum)+'</p><div class="labs">'+['00 cluster','01 producer','02 consumer','03 partitions','04 groups','05 offsets','06 replication','07 transactions','08 compaction','09 Spring Kafka','10 outbox','11 idempotency','12 retries & DLT','13 Streams'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="tags" style="margin:0">'+i.stack.map(s=>'<span class="tt">'+s+'</span>').join('')+softTags(i)+'</div></div>';
  kPlayer=player($('#kTools'),{m(){kPlaying=!kPlaying;kPlayer.set(kPlaying?'playing':'paused');},s(){kPlaying=false;kStep(.25);kPlayer.set('paused');},r(){kReset();kPlayer.set(kPlaying?'playing':'paused');}});
  kPlayer.set(kPlaying?'playing':'paused');
  K.msgs.forEach(m=>{m.el=null;});kRender();
  $('#kSvg').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(!g)return;document.querySelectorAll('#kSvg .n.sel').forEach(x=>x.classList.remove('sel'));if(g.classList.contains('n'))g.classList.add('sel');$('#kInfo').innerHTML=t(KI[g.dataset.k]);});
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{kVis=es[es.length-1].isIntersecting;}).observe($('#kSvg'));else kVis=true;
}
let lastTs=0;
function frame(ts){const dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;lastTs=ts;if(kPlaying&&kVis)kStep(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------------- project cards ---------------- */
function renderProjects(){
  const ids=['buildear','golia','granja','rtfm','g11','g10'];
  $('#pgrid').innerHTML=ids.map(id=>{const i=byId[id];
    return '<article class="pcard '+i.lane+'"><div class="y"><span>'+whenOf(i)+'</span><span class="role-pill">'+t(i.kind)+'</span></div><h4>'+t(i.title)+'</h4><p>'+t(i.org)+'</p>'
     +'<div class="tags" style="margin:0">'+techTags(i,99)+softTags(i)+'</div>'
     +'<div class="pfoot">'+repoHtml(i.repo)+'<button type="button" class="seej" data-go="'+i.id+'">'+t(S.seeJ)+' →</button></div></article>';}).join('');
}
$('#pgrid').addEventListener('click',e=>{const b=e.target.closest('.seej');if(b){setFilter(null);openItem(b.dataset.go,true);}});

/* ---------------- tech tiers ---------------- */
const TIERS=[
 ['Java 21','Spring Boot','Microservices','JPA / Hibernate','Flyway','MySQL','SQL Server','Oracle SQL','Testing','Code review','Clean architecture','DDD','Git','Scrum'],
 ['Spec-Driven Development (Kiro)','Redis','AWS (EC2, Kinesis, CloudWatch)','Docker','Datadog','Kibana','GitHub Actions','Testcontainers','Python','Kotlin','TypeScript'],
 ['Kafka','Quarkus','LLM integration (Spring AI)','Terraform','Kubernetes','System design for the cloud']
];

/* ---------------- theme ---------------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
const sysDark=()=>!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
function curTheme(){const a=document.documentElement.getAttribute('data-theme');return a==='dark'||a==='light'?a:(sysDark()?'dark':'light');}
function drawTheme(){const d=curTheme()==='dark';const b=$('#themeBtn');b.innerHTML=d?SUN:MOON;const lbl=L==='es'?(d?'Cambiar a modo claro':'Cambiar a modo oscuro'):(d?'Switch to light mode':'Switch to dark mode');b.setAttribute('aria-label',lbl);b.title=lbl;}
try{const th=localStorage.getItem('theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}drawTheme();});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawTheme);

/* ---------------- language & scroll ---------------- */
function renderAll(){renderStatic();renderFilters();renderJourney();renderSoft();renderKafka();renderProjects();tour.redraw();drawTheme();}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b||b.dataset.l===L)return;L=b.dataset.l;try{localStorage.setItem('lang',L);}catch(err){}
  const kp=kPlaying;renderAll();kPlaying=kp;kPlayer.set(kp?'playing':'paused');onScroll();});
renderAll();
const SEC=['journey','soft','projects'];
function onScroll(){const h=document.documentElement;const p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);const pr=$('#progress');if(pr)pr.style.width=Math.min(100,p*100).toFixed(2)+'%';
  let cur='';SEC.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<140)cur=id;});
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));}
addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>
